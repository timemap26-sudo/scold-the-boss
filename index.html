<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>罵老闆</title>
<meta name="description" content="用麥克風或打字狠狠罵老闆，看他道歉、哭、崩潰給你看。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😭</text></svg>">
<style>
  :root{
    --bg:#f4efe6; --wall:#e9dfcf; --ink:#2a2420; --muted:#7a6e63; --card:#fffaf2;
    --accent:#e2483d; --accent-2:#f5a623; --line:#d8ccb9; --ok:#3aa76d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 16px 32px}
  header{text-align:center;margin:4px 0 10px}
  h1{margin:0;font-size:clamp(26px,6vw,40px);letter-spacing:2px}
  h1 span{color:var(--accent)}
  .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
  main{width:100%;max-width:720px}

  /* ---------- stage ---------- */
  .stage{position:relative;width:100%;aspect-ratio:480/420;border-radius:18px;overflow:hidden;
    background:linear-gradient(#efe5d4 0 70%,#d9c9ae 70% 100%);border:3px solid var(--ink);
    box-shadow:0 6px 0 var(--ink)}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .bubble{position:absolute;top:3%;right:3%;max-width:46%;background:#fff;border:3px solid var(--ink);
    border-radius:16px;padding:8px 12px;font-weight:700;font-size:clamp(13px,3.4vw,19px);line-height:1.35;
    box-shadow:3px 3px 0 var(--ink);transform-origin:10% 100%;z-index:3}
  .bubble::after{content:"";position:absolute;left:14px;bottom:-14px;border:8px solid transparent;
    border-top:10px solid var(--ink)}
  .bubble.pop{animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
  .projectile{position:absolute;left:50%;bottom:4%;z-index:4;font-weight:900;white-space:nowrap;
    font-size:clamp(16px,4.5vw,26px);pointer-events:none;-webkit-text-stroke:1px var(--ink);
    text-shadow:2px 2px 0 var(--ink)}
  .dmg{position:absolute;z-index:5;font-weight:900;color:var(--accent);font-size:clamp(20px,6vw,34px);
    -webkit-text-stroke:1.5px #fff;pointer-events:none;animation:dmg 1s ease-out forwards}
  @keyframes dmg{0%{transform:translate(-50%,0) scale(.6);opacity:1}30%{transform:translate(-50%,-20px) scale(1.2)}
    100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
  .flash.on{animation:flash .25s}
  @keyframes flash{0%{opacity:.6}100%{opacity:0}}

  /* ---------- meter ---------- */
  .meter{margin:14px 0 6px;display:flex;align-items:center;gap:10px}
  .meter label{font-weight:800;white-space:nowrap}
  .bar{flex:1;height:22px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden;position:relative}
  .fill{height:100%;width:0;background:linear-gradient(90deg,#5cc98a,#f5d13b 45%,#f5a623 65%,#e2483d);
    background-size:calc(100% * 100 / var(--p, 1)) 100%;transition:width .4s cubic-bezier(.2,1.4,.4,1)}
  .stagename{min-width:5.5em;text-align:right;font-weight:800;color:var(--accent)}
  .stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}

  /* ---------- controls ---------- */
  .controls{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px;box-shadow:0 4px 0 var(--ink)}
  form{display:flex;gap:8px}
  input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:3px solid var(--ink);
    border-radius:12px;background:#fff;color:var(--ink);outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  button{font:inherit;font-weight:800;cursor:pointer;border:3px solid var(--ink);border-radius:12px;
    background:var(--accent);color:#fff;padding:10px 16px;box-shadow:0 3px 0 var(--ink);transition:transform .05s}
  button:active{transform:translateY(3px);box-shadow:none}
  button.secondary{background:#fff;color:var(--ink)}
  .row{display:flex;gap:8px;margin-top:10px;align-items:stretch;flex-wrap:wrap}
  #micBtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent-2);color:var(--ink);min-width:180px}
  #micBtn.on{background:var(--accent);color:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 3px 0 var(--ink),0 0 0 6px rgba(226,72,61,.25)}}
  .lvl{width:46px;height:10px;border:2px solid currentColor;border-radius:6px;overflow:hidden;display:none}
  #micBtn.on .lvl{display:block}
  .lvl i{display:block;height:100%;width:0;background:currentColor}
  .caption{min-height:1.4em;margin-top:8px;color:var(--muted);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chips button{font-size:14px;padding:6px 10px;background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--ink);border-width:2px}
  .hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5}

  /* ---------- KO overlay ---------- */
  .ko{position:fixed;inset:0;background:rgba(30,20,15,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .ko.show{display:flex}
  .ko .card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:22px;max-width:400px;width:100%;
    text-align:center;box-shadow:0 6px 0 var(--ink);animation:pop .4s}
  .ko h2{margin:0 0 6px;font-size:30px;color:var(--accent)}
  .ko p{margin:6px 0}
  .ko .quote{background:#fff;border:2px dashed var(--line);border-radius:10px;padding:8px;margin:10px 0;font-weight:700;word-break:break-all}

  /* ---------- boss SVG animation ---------- */
  #boss *{transform-box:fill-box}
  [data-face],[data-show]{display:none}
  #bossAll.hit{animation:hit .35s}
  @keyframes hit{20%{transform:translate(-10px,3px) rotate(-2deg)}50%{transform:translate(9px,-2px) rotate(2deg)}80%{transform:translate(-4px,0)}}
  #boss[data-state=breakdown] #bossBody{animation:shake .12s infinite}
  @keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,-1px)}}
  #head{transform-origin:50% 100%;transition:transform .4s}
  #boss[data-state=sorry] #head{animation:bow 1.1s ease-in-out infinite}
  @keyframes bow{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(14px) rotate(-4deg)}}
  #boss[data-state=sad] #head{transform:translateY(6px) rotate(3deg)}
  #boss[data-state=cry] #head{animation:sob .5s ease-in-out infinite}
  @keyframes sob{50%{transform:translateY(5px) scaleY(.97)}}
  .skin{fill:#f7c99b;transition:fill .6s}
  #boss[data-state=sad] .skin{fill:#f0c2a0}
  #boss[data-state=cry] .skin{fill:#f2b39b}
  #boss[data-state=breakdown] .skin{fill:#b9d4e8}
  .stream{stroke-dasharray:10 8;animation:flow .35s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .drop{animation:fall 1.1s ease-in infinite;transform-origin:center}
  .drop.d2{animation-delay:.55s}
  @keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(90px);opacity:0}}
  .sweat{animation:sweat 1.6s ease-in infinite}
  @keyframes sweat{0%{transform:translateY(0);opacity:1}100%{transform:translateY(30px);opacity:0}}
  .spiral{transform-origin:center;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #combover{transform-origin:50% 100%;transition:transform .3s}
  #boss[data-state=breakdown] #combover{animation:hair .25s infinite}
  @keyframes hair{0%,100%{transform:rotate(-20deg) translateY(-14px)}50%{transform:rotate(22deg) translateY(-18px)}}
  #glasses{transform-origin:center;transition:transform .3s}
  #boss[data-state=cry] #glasses{transform:translateY(-14px)}
  #boss[data-state=breakdown] #glasses{transform:translateY(16px) rotate(-14deg)}
  #puddle{transform-origin:center;transform:scale(0);transition:transform 1.5s}
  #boss[data-state=cry] #puddle{transform:scale(.6)}
  #boss[data-state=breakdown] #puddle{transform:scale(1)}
  .fly{animation:flytear .7s ease-out infinite}
  .fly.r{animation-name:flytearR}
  .fly.late{animation-delay:.35s}
  @keyframes flytear{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-60px,40px);opacity:0}}
  @keyframes flytearR{0%{transform:translate(0,0);opacity:1}100%{transform:translate(60px,40px);opacity:0}}
  /* ---------- photo mode ---------- */
  #boss.photo .cartoon{display:none!important}
  #boss:not(.photo) .photo-only{display:none!important}
  #bossPhoto{transition:filter .6s}
  #boss[data-state=sad] #bossPhoto{filter:saturate(.8) brightness(.97)}
  #boss[data-state=cry] #bossPhoto{filter:saturate(1.25) sepia(.15) brightness(.97)}
  #boss[data-state=breakdown] #bossPhoto{filter:grayscale(.4) sepia(.3) hue-rotate(170deg) saturate(1.6) brightness(1.05)}
  #photoBtn{background:#fff;color:var(--ink)}
  .modal{position:fixed;inset:0;background:rgba(30,20,15,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
  .modal.show{display:flex}
  .modal .card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;max-width:380px;width:100%;
    text-align:center;box-shadow:0 6px 0 var(--ink);max-height:100%;overflow:auto}
  .modal h2{margin:0 0 4px;font-size:22px}
  .modal .note{margin:0 0 8px;color:var(--muted);font-size:13px;line-height:1.45}
  #alignCanvas{width:min(240px,70vw);aspect-ratio:416/520;border:3px solid var(--ink);border-radius:12px;background:#ddd;
    touch-action:none;cursor:grab;display:block;margin:0 auto}
  #alignCanvas:active{cursor:grabbing}
  .slider{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:700}
  .slider input{flex:1}
  .modal .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
  .modal .btns button{flex:1;min-width:90px}
  #detectStatus{min-height:1.3em;font-size:13px;color:var(--muted);margin-top:6px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:0s!important}}
</style>
</head>
<body>
<header>
  <h1>罵<span>老闆</span> 🤬</h1>
  <p class="sub">用麥克風大聲罵，或打字罵。罵得越狠，他崩潰得越快。</p>
</header>

<main>
  <div class="stage" id="stage">
    <svg viewBox="0 0 480 420" aria-label="坐在老闆桌後面的卡通老闆">
      <!-- wall decor -->
      <g>
        <rect x="24" y="30" width="110" height="90" rx="6" fill="#bfe1f2" stroke="#2a2420" stroke-width="4"/>
        <line x1="79" y1="30" x2="79" y2="120" stroke="#2a2420" stroke-width="4"/>
        <line x1="24" y1="75" x2="134" y2="75" stroke="#2a2420" stroke-width="4"/>
        <circle cx="52" cy="54" r="10" fill="#fff6c9"/>
        <rect x="362" y="150" width="96" height="70" rx="4" fill="#fff" stroke="#2a2420" stroke-width="4"/>
        <text x="410" y="176" text-anchor="middle" font-size="12" font-weight="800" fill="#2a2420">本月最佳員工</text>
        <text x="410" y="203" text-anchor="middle" font-size="18" font-weight="900" fill="#e2483d">老闆本人</text>
      </g>

      <g id="boss" data-state="calm">
       <g id="bossAll">
        <!-- chair -->
        <rect x="132" y="70" width="216" height="260" rx="40" fill="#5a3326" stroke="#2a2420" stroke-width="5"/>
        <rect x="150" y="88" width="180" height="220" rx="30" fill="#6e4030"/>

        <g id="bossBody">
          <!-- neck (photo mode): sits behind the face photo, coloured from the photo's skin -->
          <g class="photo-only" id="neck">
            <defs><linearGradient id="neckShade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".45" stop-color="#000" stop-opacity=".08"/>
              <stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient></defs>
            <path id="neckSkin" d="M218,200 L262,200 Q260,226 267,246 L213,246 Q220,226 218,200 Z" fill="#e8b591"/>
            <path d="M218,200 L262,200 Q260,226 267,246 L213,246 Q220,226 218,200 Z" fill="url(#neckShade)"/>
          </g>
          <!-- suit -->
          <path d="M140,330 Q146,248 240,238 Q334,248 340,330 Z" fill="#2f3d5c" stroke="#2a2420" stroke-width="5"/>
          <path d="M212,242 L240,300 L268,242 Q240,236 212,242 Z" fill="#fff" stroke="#2a2420" stroke-width="4"/>
          <path d="M232,248 L248,248 L254,290 L240,306 L226,290 Z" fill="#e2483d" stroke="#2a2420" stroke-width="4"/>
          <path d="M212,242 L232,300 L200,262 Z M268,242 L248,300 L280,262 Z" fill="#26324d" stroke="#2a2420" stroke-width="3"/>

          <g id="head">
            <!-- ears -->
            <g class="cartoon">
            <ellipse class="skin" cx="166" cy="160" rx="13" ry="19" stroke="#2a2420" stroke-width="5"/>
            <ellipse class="skin" cx="314" cy="160" rx="13" ry="19" stroke="#2a2420" stroke-width="5"/>
            </g>
            <!-- head -->
            <ellipse class="skin cartoon" cx="240" cy="152" rx="74" ry="84" stroke="#2a2420" stroke-width="5"/>
            <g class="cartoon">
            <!-- side hair -->
            <path d="M168,150 Q164,108 186,92 Q178,120 184,150 Z" fill="#6b6460" stroke="#2a2420" stroke-width="4"/>
            <path d="M312,150 Q316,108 294,92 Q302,120 296,150 Z" fill="#6b6460" stroke="#2a2420" stroke-width="4"/>
            <!-- combover -->
            <g id="combover" fill="none" stroke="#4b4542" stroke-width="4" stroke-linecap="round">
              <path d="M196,80 Q240,58 286,84"/>
              <path d="M200,74 Q244,54 280,72"/>
              <path d="M206,70 Q246,52 274,64"/>
            </g>
            <!-- cheeks -->
            <g data-show="nervous sorry sad cry">
              <ellipse cx="196" cy="186" rx="12" ry="7" fill="#ef8f86" opacity=".6"/>
              <ellipse cx="284" cy="186" rx="12" ry="7" fill="#ef8f86" opacity=".6"/>
            </g>

            <!-- ===== faces ===== -->
            <!-- calm: smug -->
            <g data-face="calm">
              <path d="M196,128 L226,124 M254,122 L284,130" stroke="#2a2420" stroke-width="6" stroke-linecap="round"/>
              <ellipse cx="212" cy="152" rx="10" ry="8" fill="#fff"/><circle cx="214" cy="154" r="4.5" fill="#2a2420"/>
              <ellipse cx="268" cy="152" rx="10" ry="8" fill="#fff"/><circle cx="270" cy="154" r="4.5" fill="#2a2420"/>
              <path class="skin" d="M201,152 A11,9 0 0 1 223,152 Z M257,152 A11,9 0 0 1 279,152 Z" stroke="#2a2420" stroke-width="3"/>
              <path d="M222,214 Q244,224 262,206" fill="none" stroke="#2a2420" stroke-width="5" stroke-linecap="round"/>
            </g>
            <!-- nervous -->
            <g data-face="nervous">
              <path d="M196,134 L226,124 M254,124 L284,134" stroke="#2a2420" stroke-width="6" stroke-linecap="round"/>
              <circle cx="212" cy="152" r="10" fill="#fff"/><circle cx="212" cy="152" r="3" fill="#2a2420"/>
              <circle cx="268" cy="152" r="10" fill="#fff"/><circle cx="268" cy="152" r="3" fill="#2a2420"/>
              <path d="M220,218 q5,-6 10,0 t10,0 t10,0 t10,0" fill="none" stroke="#2a2420" stroke-width="4" stroke-linecap="round"/>
            </g>
            <!-- sorry -->
            <g data-face="sorry">
              <path d="M196,136 L226,126 M254,126 L284,136" stroke="#2a2420" stroke-width="6" stroke-linecap="round"/>
              <path d="M202,150 Q212,160 222,150 M258,150 Q268,160 278,150" fill="none" stroke="#2a2420" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="240" cy="220" rx="10" ry="8" fill="#5a1f1a" stroke="#2a2420" stroke-width="3"/>
            </g>
            <!-- sad -->
            <g data-face="sad">
              <path d="M196,138 L226,122 M254,122 L284,138" stroke="#2a2420" stroke-width="6" stroke-linecap="round"/>
              <circle cx="212" cy="153" r="12" fill="#fff"/><circle cx="212" cy="155" r="7" fill="#2a2420"/><circle cx="215" cy="152" r="2.5" fill="#fff"/>
              <circle cx="268" cy="153" r="12" fill="#fff"/><circle cx="268" cy="155" r="7" fill="#2a2420"/><circle cx="271" cy="152" r="2.5" fill="#fff"/>
              <path d="M201,160 Q212,168 223,160 M257,160 Q268,168 279,160" fill="none" stroke="#7cc4f0" stroke-width="4"/>
              <path d="M220,224 Q230,212 240,218 Q250,212 260,224" fill="none" stroke="#2a2420" stroke-width="5" stroke-linecap="round"/>
              <path class="drop" d="M208,168 q-5,9 0,12 q5,-3 0,-12 Z" fill="#7cc4f0" stroke="#2a2420" stroke-width="1.5"/>
              <path class="drop d2" d="M272,168 q-5,9 0,12 q5,-3 0,-12 Z" fill="#7cc4f0" stroke="#2a2420" stroke-width="1.5"/>
            </g>
            <!-- cry -->
            <g data-face="cry">
              <path d="M196,128 L226,136 M254,136 L284,128" stroke="#2a2420" stroke-width="6" stroke-linecap="round"/>
              <path d="M202,144 L220,152 L202,160 M278,144 L260,152 L278,160" fill="none" stroke="#2a2420" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M210,206 Q240,194 270,206 Q266,244 240,246 Q214,244 210,206 Z" fill="#5a1f1a" stroke="#2a2420" stroke-width="4"/>
              <path d="M222,236 Q240,224 258,236 Q240,246 222,236 Z" fill="#e2716b"/>
            </g>
            <!-- breakdown -->
            <g data-face="breakdown">
              <path d="M194,122 L228,132 M252,132 L286,122" stroke="#2a2420" stroke-width="6" stroke-linecap="round"/>
              <circle cx="212" cy="152" r="13" fill="#fff" stroke="#2a2420" stroke-width="2"/>
              <circle cx="268" cy="152" r="13" fill="#fff" stroke="#2a2420" stroke-width="2"/>
              <path class="spiral" d="M212,152 a2,2 0 1,1 4,0 a4,4 0 1,1 -8,0 a6,6 0 1,1 12,0 a8,8 0 1,1 -16,0 a10,10 0 1,1 20,0" fill="none" stroke="#2a2420" stroke-width="2.5"/>
              <path class="spiral" d="M268,152 a2,2 0 1,1 4,0 a4,4 0 1,1 -8,0 a6,6 0 1,1 12,0 a8,8 0 1,1 -16,0 a10,10 0 1,1 20,0" fill="none" stroke="#2a2420" stroke-width="2.5"/>
              <ellipse cx="240" cy="222" rx="22" ry="27" fill="#5a1f1a" stroke="#2a2420" stroke-width="4"/>
              <path d="M226,238 Q240,228 254,238 Q240,248 226,238 Z" fill="#e2716b"/>
              <path d="M222,198 L258,198" stroke="#fff" stroke-width="5"/>
            </g>

            <!-- glasses -->
            <g id="glasses" fill="none" stroke="#2a2420" stroke-width="4">
              <rect x="190" y="136" width="44" height="34" rx="10" fill="rgba(255,255,255,.18)"/>
              <rect x="246" y="136" width="44" height="34" rx="10" fill="rgba(255,255,255,.18)"/>
              <path d="M234,150 Q240,145 246,150 M190,148 L170,144 M290,148 L310,144"/>
            </g>
            <!-- nose & mustache -->
            <ellipse cx="240" cy="182" rx="9" ry="7" fill="#e9a77c" stroke="#2a2420" stroke-width="3"/>
            <path d="M212,198 Q226,186 240,196 Q254,186 268,198 Q254,204 240,200 Q226,204 212,198 Z" fill="#4b4542" stroke="#2a2420" stroke-width="3"/>
            </g>

            <!-- ===== uploaded photo face ===== -->
            <!-- shrunk around the eye line so the photo head matches the body and the chin sits above the collar -->
            <g class="photo-only" transform="translate(240 146) scale(.75) translate(-240 -146)">
              <image id="bossPhoto" x="136" y="20" width="208" height="260" preserveAspectRatio="none"/>
              <g data-show="nervous sorry sad cry">
                <ellipse cx="197" cy="180" rx="13" ry="7" fill="#ff6b6b" opacity=".35"/>
                <ellipse cx="283" cy="180" rx="13" ry="7" fill="#ff6b6b" opacity=".35"/>
              </g>
              <g data-show="sad">
                <path class="drop" d="M209,160 q-5,9 0,12 q5,-3 0,-12 Z" fill="#7cc4f0" stroke="#2a2420" stroke-width="1.5"/>
                <path class="drop d2" d="M271,160 q-5,9 0,12 q5,-3 0,-12 Z" fill="#7cc4f0" stroke="#2a2420" stroke-width="1.5"/>
              </g>
              <g class="pmouth" data-show="cry">
                <path d="M219,-8 Q240,-19 261,-8 Q258,20 240,22 Q222,20 219,-8 Z" fill="#5a1f1a" stroke="#2a2420" stroke-width="3" opacity=".88"/>
                <path d="M229,14 Q240,6 251,14 Q240,21 229,14 Z" fill="#e2716b" opacity=".9"/>
              </g>
              <g data-show="breakdown">
                <circle cx="211" cy="146" r="13" fill="#fff" stroke="#2a2420" stroke-width="2"/>
                <circle cx="269" cy="146" r="13" fill="#fff" stroke="#2a2420" stroke-width="2"/>

              <circle class="fly r late" cx="284" cy="160" r="5"/>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const boss = $('#boss'), bossAll = $('#bossAll'), stage = $('#stage');
  const bubble = $('#bubble'), fill = $('#fill'), bar = $('#bar');

  const STAGES = [
    { min: 0,  key: 'calm',      label: '淡定', pitch: .85, rate: .95, lines: ['蛤？你說什麼？我沒聽清楚。', '有話好好說嘛，年輕人。', '冷靜一點，我們開個會討論一下。', '這是公司文化，你要學著適應。'] },
    { min: 15, key: 'nervous',   label: '心虛', pitch: .9, rate: 1.02, lines: ['呃…對、對不起…', '好啦好啦，是我不對…', '我…我下次會注意的…', '你、你先別激動嘛…'] },
    { min: 35, key: 'sorry',     label: '狂道歉', pitch: .95, rate: 1.1, lines: ['對不起！真的很對不起！', '抱歉抱歉抱歉抱歉！', '是我的錯，我深刻反省！', '拜託原諒我！我給你鞠躬！'] },
    { min: 55, key: 'sad',       label: '快哭了', pitch: 1, rate: .88, lines: ['嗚…對不起…我知道錯了…', '別再罵了…我心好痛…', '我…我也是有壓力的嘛…', '嗚嗚…我真的不是故意的…'] },
    { min: 75, key: 'cry',       label: '大哭', pitch: 1.05, rate: 1.05, lines: ['嗚嗚嗚嗚——對不起啦！', '哇啊啊啊我錯了啦！！', '媽媽…我想回家…嗚嗚…', '我是爛老闆！嗚哇——！'] },
    { min: 92, key: 'breakdown', label: '崩潰', pitch: 1.15, rate: 1.2, lines: ['啊啊啊啊啊啊——！！！', '我不配當老闆！！我不配！！', '我辭職！我辭職好不好！！', '公司給你！全部給你！！'] },
  ];

  const SPECIAL = [
    { re: /加班|overtime/i, lines: ['好好好！今天不用加班！', '以後準時下班！我保證！', '加班費三倍！不，十倍！'] },
    { re: /薪水|加薪|薪資|工資|錢/, lines: ['加！馬上加薪！', '薪水翻倍！求你別罵了！', '我的薪水分你一半！'] },
    { re: /年終|獎金|分紅/, lines: ['年終發十個月！', '獎金！大家都有獎金！'] },
    { re: /休假|放假|請假|特休|假/, lines: ['放假！全公司放假！', '特休隨便你請！'] },
    { re: /開會|會議/, lines: ['再也不開沒意義的會了！', '會議全部取消！'] },
    { re: /辭職|離職|不幹/, lines: ['不要走！拜託不要走！', '公司不能沒有你啊！'] },
  ];

  const KEYWORDS = ['豬頭','笨蛋','白痴','白癡','混蛋','垃圾','廢物','智障','王八','機車','慣老闆','無能','可惡','討厭','摳門','小氣','變態','奴隸','過勞','壓榨','剝削','爛','滾','雞排','慣','情緒勒索','畫大餅','大餅','吸血','黑心','血汗','垃圾','笑話','去你的','靠','幹','加班','薪水','年終'];

  const QUICK = ['又要加班？！', '薪水什麼時候加？', '你這個豬頭老闆！', '不要再畫大餅了！', '開會開不完！', '血汗黑心公司！', '年終呢？！', '我要放假！'];

  let rage = 0, hits = 0, startTime = 0, lastHit = 0, ko = false;
  let best = { text: '', dmg: 0 }, lastLine = '';
  let soundOn = true, curStage = STAGES[0];

  const stageFor = r => STAGES.reduce((s, st) => r >= st.min ? st : s, STAGES[0]);

  function setState(key) {
    boss.dataset.state = key;
    boss.querySelectorAll('[data-face]').forEach(g => g.style.display = g.dataset.face === key ? 'inline' : 'none');
    boss.querySelectorAll('[data-show]').forEach(g => g.style.display = g.dataset.show.split(' ').includes(key) ? 'inline' : 'none');
    if (typeof showPhotoFace === 'function') showPhotoFace();
  }

  function render() {
    const p = Math.max(0, Math.min(100, rage));
    fill.style.width = p + '%';
    fill.style.setProperty('--p', Math.max(p, 1));
    bar.setAttribute('aria-valuenow', Math.round(p));
    const st = stageFor(p);
    $('#stageName').textContent = `${st.label} ${Math.round(p)}%`;
    if (st !== curStage) { curStage = st; setState(st.key); }
  }

  function say(line) {
    bubble.textContent = line;
    bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
  }

  // ---------- voices ----------
  // Prefer a realistic male Chinese voice (neural/"Natural" voices first).
  const MALE = /yunjhe|zhiwei|yunxi|yunjian|yunyang|yunhao|yunfeng|yunze|yunye|kangkang|wanlung|danny|li-?mu|\bhan\b|\bmale|男/i;
  const FEMALE = /female|hsiaochen|hsiaoyu|yating|hanhan|xiaoxiao|xiaoyi|huihui|yaoyao|tracy|hiumaan|hiugaai|mei-?jia|sin-?ji|ting-?ting|女/i;
  const NATURAL = /natural|neural|online|premium|enhanced/i;
  let voice = null, isMale = false;
  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter(v => /^(zh|cmn|yue)/i.test(v.lang));
    const score = v => {
      let s = 0;
      if (MALE.test(v.name) && !FEMALE.test(v.name)) s += 100;
      if (NATURAL.test(v.name)) s += 20;
      if (/zh[-_]TW|Hant/i.test(v.lang)) s += 10;
      else if (/zh[-_]HK|yue/i.test(v.lang)) s += 2;
      else s += 5;
      return s;
    };
    voice = vs.sort((a, b) => score(b) - score(a))[0] || null;
    isMale = !!voice && MALE.test(voice.name) && !FEMALE.test(voice.name);
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  // Pre-rendered clips: free Microsoft Edge neural Taiwan-Mandarin male voice
  // (zh-TW-YunJheNeural), made by tools/gen_voice.py. Named by FNV-1a hash of the text.
  const clean = line => line.replace(/（.*?）/g, '').trim();
  const fnv = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };
  const clip = new Audio(); clip.preload = 'auto';
  let clipPlaying = false;
  clip.onplaying = () => clipPlaying = true;
  clip.onended = clip.onpause = () => clipPlaying = false;
  function speak(line, st) {
    if (!soundOn) return;
    const text = clean(line);
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    clip.pause();
    clip.onerror = () => { clipPlaying = false; speakTTS(text, st); };
    clip.src = 'voice/' + fnv(text) + '.mp3';
    clip.play().catch(e => { if (e.name !== 'AbortError') speakTTS(text, st); });
  }
  function speakTTS(text, st) {
    if (!soundOn || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : 'zh-TW'; if (voice) u.voice = voice;
    // No male voice available → drop pitch so a female/default voice sounds deeper.
    u.pitch = Math.max(0.1, isMale ? st.pitch : st.pitch * 0.6);
    u.rate = st.rate;
    speechSynthesis.speak(u);
  }
  const speakLine = line => { say(line); speak(line, curStage); };
  const bossTalking = () => clipPlaying || ('speechSynthesis' in window && speechSynthesis.speaking);

  // ---------- sfx ----------
  let actx = null;
  function sfx(power) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(220 + power * 8, t);
      o.frequency.exponentialRampToValueAtTime(50, t + .18);
      g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .22);
    } catch (e) {}
  }

  // ---------- core ----------
  function damageOf(text, vol) {
    let d = 3 + Math.min([...text].length, 30) * 0.3;
    d += Math.min(KEYWORDS.filter(k => text.includes(k)).length, 3) * 3;
    d += Math.min((text.match(/[!！?？]/g) || []).length, 4) * 1;
    d += (vol || 0) * 8;
    return Math.max(2, Math.round(Math.min(d, 18)));
  }

  function pickLine(text, st) {
    if (rage >= 15) {
      const sp = SPECIAL.find(s => s.re.test(text));
      if (sp && Math.random() < .75) return sp.lines[Math.floor(Math.random() * sp.lines.length)];
    }
    let line, tries = 0;
    do { line = st.lines[Math.floor(Math.random() * st.lines.length)]; } while (line === lastLine && tries++ < 5);
    return line;
  }

  const COLORS = ['#e2483d', '#f5a623', '#ff6fa3', '#7b5cff', '#2bb3c0', '#ffdf3b'];
  function scold(raw, vol = 0) {
    const text = String(raw || '').trim();
    if (!text || ko) return;
    if (!startTime) startTime = performance.now();
    const el = document.createElement('div');
    el.className = 'projectile';
    el.textContent = text.length > 18 ? text.slice(0, 18) + '…' : text;
    el.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    stage.appendChild(el);
    const w = stage.clientWidth, h = stage.clientHeight;
    const anim = el.animate([
      { transform: 'translate(-50%,0) scale(1.2) rotate(0deg)', opacity: 1 },
      { transform: `translate(-50%,${-h * .55}px) scale(.55) rotate(${(Math.random() * 30 - 15)}deg)`, opacity: 1 }
    ], { duration: 420, easing: 'cubic-bezier(.3,.7,.5,1)' });
    anim.onfinish = () => { el.remove(); hit(text, vol, w, h); };
  }

  function hit(text, vol, w, h) {
    if (ko) return;
    const dmg = damageOf(text, vol);
    hits++; lastHit = performance.now();
    if (dmg > best.dmg) best = { text, dmg };
    rage = Math.min(100, rage + dmg);

    bossAll.classList.remove('hit'); void bossAll.getBBox(); bossAll.classList.add('hit');
    const f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    const d = document.createElement('div');
    d.className = 'dmg'; d.textContent = '-' + dmg;
    d.style.left = (40 + Math.random() * 20) + '%'; d.style.top = (22 + Math.random() * 10) + '%';
    stage.appendChild(d); setTimeout(() => d.remove(), 1000);
    sfx(dmg);

    render();
    $('#hitCount').textContent = `已罵 ${hits} 句`;
    const st = stageFor(rage);
    const line = rage >= 100 ? '我…我不行了……（當場崩潰）' : pickLine(text, st);
    lastLine = line;
    say(line); speak(line, st);
    if (rage >= 100) knockOut();
  }

  function knockOut() {
    ko = true;
    const secs = ((performance.now() - startTime) / 1000).toFixed(1);
    $('#koStats').textContent = `你用了 ${secs} 秒、罵了 ${hits} 句，成功讓老闆崩潰！`;
    $('#koQuote').textContent = `「${best.text}」（傷害 ${best.dmg}）`;
    setTimeout(() => $('#ko').classList.add('show'), 1600);
  }

  function reset() {
    rage = 0; hits = 0; startTime = 0; ko = false; best = { text: '', dmg: 0 };
    $('#ko').classList.remove('show');
    $('#hitCount').textContent = '已罵 0 句';
    render(); speakLine('哼…剛剛是我一時失態。好了，回去工作吧！');
  }
  $('#again').onclick = reset;

  // decay + timer
  setInterval(() => {
    if (!ko && startTime) $('#timer').textContent = ((performance.now() - startTime) / 1000).toFixed(1) + ' 秒';
    if (!ko && rage > 0 && performance.now() - lastHit > 3500) {
      const before = stageFor(rage);
      rage = Math.max(0, rage - 0.6);
      render();
      if (stageFor(rage) !== before && rage < 15) speakLine('呼…好險。哼，你剛剛說什麼來著？');
    }
  }, 100);

  // ---------- text input ----------
  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const inp = $('#text');
    scold(inp.value); inp.value = ''; inp.focus();
  });
  const chips = $('#chips');
  QUICK.forEach(q => { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = () => scold(q); chips.appendChild(b); });
  $('#soundBtn').onclick = e => {
    soundOn = !soundOn;
    e.currentTarget.textContent = soundOn ? '🔊 老闆語音' : '🔇 靜音';
    e.currentTarget.setAttribute('aria-pressed', soundOn);
    if (!soundOn) { clip.pause(); if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  };

  // ---------- microphone ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = $('#micBtn'), caption = $('#caption'), lvlEl = $('#lvl');
  let listening = false, rec = null, stream = null, analyser = null, level = 0, peak = 0, loudSince = 0, lastShout = 0, raf = 0;

  function meterLoop() {
    if (!analyser) return;
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    let sum = 0; for (const v of buf) { const x = (v - 128) / 128; sum += x * x; }
    level = Math.min(1, Math.sqrt(sum / buf.length) * 4);
    peak = Math.max(peak * 0.985, level);
    lvlEl.style.width = (level * 100) + '%';
    // fallback: no speech recognition → shouting alone hits the boss
    if (!SR && !bossTalking()) {
      const now = performance.now();
      if (level > .45) { loudSince = loudSince || now; if (now - loudSince > 250 && now - lastShout > 1200) { lastShout = now; scold('（大吼大叫）', peak); } }
      else loudSince = 0;
    }
    raf = requestAnimationFrame(meterLoop);
  }

  async function startMic() {
    listening = true;
    micBtn.classList.add('on'); $('#micLabel').textContent = '🔴 聆聽中…點此停止';
    caption.textContent = SR ? '開始罵吧！說完一句停一下，老闆就會挨罵。' : '這個瀏覽器不支援語音辨識，改用「音量模式」：大聲吼就能打到老闆！';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') await actx.resume();
      const src = actx.createMediaStreamSource(stream);
      analyser = actx.createAnalyser(); analyser.fftSize = 1024;
      src.connect(analyser); meterLoop();
    } catch (e) {
      if (!SR) { caption.textContent = '無法使用麥克風：' + (e.message || e.name) + '。請改用打字罵。'; stopMic(); return; }
    }
    if (SR) {
      rec = new SR();
      rec.lang = 'zh-TW'; rec.continuous = true; rec.interimResults = true;
      rec.onresult = ev => {
        let interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i], t = r[0].transcript;
          if (r.isFinal) {
            if (!bossTalking()) { scold(t, peak); peak = 0; caption.textContent = '🗣️ 你：' + t; }
          } else interim += t;
        }
        if (interim) caption.textContent = '🎙️ ' + interim;
      };
      rec.onerror = ev => {
        if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
          caption.textContent = '麥克風權限被拒絕了，請在瀏覽器設定允許，或改用打字罵。'; stopMic();
        } else if (ev.error === 'network') {
          caption.textContent = '語音辨識需要網路連線，請檢查網路或改用打字罵。';
        }
      };
      rec.onend = () => { if (listening) { try { rec.start(); } catch (e) {} } };
      try { rec.start(); } catch (e) {}
    }
  }

  function stopMic() {
    listening = false;
    micBtn.classList.remove('on'); $('#micLabel').textContent = '🎙️ 開麥克風罵';
    if (rec) { rec.onend = null; try { rec.stop(); } catch (e) {} rec = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    cancelAnimationFrame(raf); analyser = null; lvlEl.style.width = '0';
  }

  micBtn.onclick = () => {
    if (!navigator.mediaDevices && !SR) { caption.textContent = '這個瀏覽器不支援麥克風，請改用打字罵。'; return; }
    listening ? stopMic() : startMic();
  };

  // ---------- boss photo face ----------
  const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
  const PW = 416, PH = 520, OX = 136, OY = 20, K = 2;           // photo canvas = svg box (136,20)-(344,280) at 2x
  // head oval (svg units) — big enough to keep the hair, not just the face
  const HCX = 240, HCY = 152, HRX = 92, HRY = 124, HC = { x: (HCX - OX) * K, y: (HCY - OY) * K };
  const EYE_L = { x: (211 - OX) * K, y: (146 - OY) * K }, EYE_R = { x: (269 - OX) * K, y: (146 - OY) * K };
  const MOUTH_Y = 210;                                          // default mouth line (svg units)
  const photoEl = $('#bossPhoto'), modal = $('#photoModal'), cv = $('#alignCanvas'), cx = cv.getContext('2d');
  const zoomIn = $('#zoomIn'), rotIn = $('#rotIn'), dStatus = $('#detectStatus');
  let src = null, tf = null, baseZoom = 1, baseRot = 0, mouthY = MOUTH_Y, faces = null;

  // canvas = T + R(rot) * s * photo
  const apply = (t, p) => { const c = Math.cos(t.rot), s = Math.sin(t.rot);
    return { x: t.tx + t.s * (c * p.x - s * p.y), y: t.ty + t.s * (s * p.x + c * p.y) }; };

  function fitDefault(img) {
    const s = Math.max(2 * HRX * K / img.width, 2 * HRY * K / img.height) * 1.05;
    return { s, rot: 0, tx: HC.x - s * img.width / 2, ty: HC.y - s * img.height / 2 };
  }
  // map the eyes onto the guide circles; the roll angle also uses the ear points
  // (eye points alone are jittery, especially behind glasses)
  function fitEyes(a, b, e1, e2) {
    if (a.x > b.x) [a, b] = [b, a];
    const dx = b.x - a.x, dy = b.y - a.y;
    let ang = Math.atan2(dy, dx);
    if (e1 && e2) {
      if (e1.x > e2.x) [e1, e2] = [e2, e1];
      const ea = Math.atan2(e2.y - e1.y, e2.x - e1.x);
      if (Math.abs(ea - ang) < .35) ang = (ang + ea) / 2;
    }
    if (Math.abs(ang) < .025) ang = 0;                          // under ~1.5°: keep the photo straight
    const d = dx * Math.cos(ang) + dy * Math.sin(ang);          // eye distance along the roll axis
    const s = (EYE_R.x - EYE_L.x) / d, rot = -ang;
    const t = { s, rot, tx: 0, ty: 0 }, p = apply(t, { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    t.tx = (EYE_L.x + EYE_R.x) / 2 - p.x; t.ty = EYE_L.y - p.y;
    return t;
  }

  function drawPhoto(ctx, t) {
    const c = Math.cos(t.rot), s = Math.sin(t.rot);
    ctx.setTransform(t.s * c, t.s * s, -t.s * s, t.s * c, t.tx, t.ty);
    ctx.drawImage(src, 0, 0); ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  // feathered oval so the face blends in without a hard frame
  function softMask(ctx) {
    const cxp = HC.x, cyp = HC.y, rx = HRX * K, ry = HRY * K;
    ctx.save(); ctx.translate(cxp, cyp); ctx.scale(1, ry / rx);
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    gr.addColorStop(0, '#000'); gr.addColorStop(.86, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  const headPath = ctx => { ctx.beginPath(); ctx.ellipse(HC.x, HC.y, HRX * K, HRY * K, 0, 0, Math.PI * 2); };

  function drawAlign() {
    cx.clearRect(0, 0, PW, PH);
    cx.fillStyle = '#ccc'; cx.fillRect(0, 0, PW, PH);
    drawPhoto(cx, tf);
    // dim outside head
    cx.save(); cx.fillStyle = 'rgba(40,30,25,.55)'; cx.beginPath(); cx.rect(0, 0, PW, PH);
    cx.ellipse(HC.x, HC.y, HRX * K, HRY * K, 0, 0, Math.PI * 2); cx.fill('evenodd'); cx.restore();
    cx.lineWidth = 3; cx.strokeStyle = '#fff'; headPath(cx); cx.stroke();
    cx.setLineDash([6, 5]); cx.strokeStyle = '#ffdf3b';
    [EYE_L, EYE_R].forEach(e => { cx.beginPath(); cx.arc(e.x, e.y, 14, 0, Math.PI * 2); cx.stroke(); });
    const my = (mouthY - OY) * K;
    cx.beginPath(); cx.moveTo(PW / 2 - 34, my); cx.lineTo(PW / 2 + 34, my); cx.stroke(); cx.setLineDash([]);
  }

  // set sliders relative to the current transform
  function syncSliders() { baseZoom = tf.s; baseRot = tf.rot; zoomIn.value = 0; rotIn.value = 0; }
  function around(t, k, dr) {   // zoom by k and rotate by dr around the head centre
    const c = HC, cs = Math.cos(dr), sn = Math.sin(dr);
    const vx = t.tx - c.x, vy = t.ty - c.y;
    return { s: t.s * k, rot: t.rot + dr, tx: c.x + k * (cs * vx - sn * vy), ty: c.y + k * (sn * vx + cs * vy) };
  }
  function onSlider() {
    const want = { s: baseZoom * Math.pow(2, +zoomIn.value), rot: baseRot + (+rotIn.value) * Math.PI / 180 };
    tf = around(tf, want.s / tf.s, want.rot - tf.rot); drawAlign();
  }
  zoomIn.oninput = rotIn.oninput = onSlider;
  cv.addEventListener('wheel', e => { e.preventDefault(); zoomIn.value = Math.max(-2, Math.min(2, +zoomIn.value - e.deltaY * .002)); onSlider(); }, { passive: false });

  // drag (one finger / mouse) and pinch (two fingers)
  const ptrs = new Map(); let pinch0 = null;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinch0 = null; });
  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId) || !tf) return;
    const r = PW / cv.clientWidth, prev = ptrs.get(e.pointerId);
    if (ptrs.size === 1) { tf.tx += (e.clientX - prev.x) * r; tf.ty += (e.clientY - prev.y) * r; }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch0) { zoomIn.value = Math.max(-2, Math.min(2, +zoomIn.value + Math.log2(d / pinch0))); onSlider(); }
      pinch0 = d;
    }
    drawAlign();
  });
  const up = e => { ptrs.delete(e.pointerId); pinch0 = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  let detectorP = null, detector = null;
  function getDetector() {
    if (!detectorP) {
      detectorP = import(VISION + '/vision_bundle.mjs').then(async v => {
        const fs = await v.FilesetResolver.forVisionTasks(VISION + '/wasm');
        return v.FaceDetector.createFromOptions(fs, {
          baseOptions: { modelAssetPath: FACE_MODEL, delegate: 'CPU' }, runningMode: 'IMAGE', minDetectionConfidence: .35 });
      });
      detectorP.catch(() => { detectorP = null; });
    }
    return detectorP;
  }
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

  async function autoAlign(token) {
    dStatus.textContent = '🔎 正在找老闆的臉…';
    try {
      const det = await withTimeout(getDetector(), 20000);
      if (token !== loadToken) return;
      detector = det;
      const res = det.detect(src);
      faces = (res.detections || []).filter(d => d.keypoints && d.keypoints.length >= 4)
        .sort((a, b) => b.boundingBox.width * b.boundingBox.height - a.boundingBox.width * a.boundingBox.height);
      if (!faces.length) { dStatus.textContent = '找不到臉 😅 請手動拖曳對準。'; return; }
      useFace(0);
    } catch (e) {
      if (token === loadToken) dStatus.textContent = '自動對位無法使用，請手動拖曳對準。';
    }
  }
  // second pass: detect again on the straightened face (keypoints are less accurate on tilted heads)
  function refine(det, t) {
    const S = 480, k = .75, ox = S / 2 - k * HC.x, oy = S / 2 - k * HC.y;
    const c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'); g.fillStyle = '#888'; g.fillRect(0, 0, S, S);
    drawPhoto(g, { s: t.s * k, rot: t.rot, tx: t.tx * k + ox, ty: t.ty * k + oy });
    const d = (det.detect(c).detections || []).filter(d => d.keypoints && d.keypoints.length >= 4)
      .map(d => ({ d, kp: d.keypoints.map(q => ({ x: (q.x * S - ox) / k, y: (q.y * S - oy) / k })) }))
      .sort((a, b) => Math.hypot(a.kp[2].x - HC.x, a.kp[2].y - HC.y) - Math.hypot(b.kp[2].x - HC.x, b.kp[2].y - HC.y))[0];
    if (!d) return null;
    const B = fitEyes(...d.kp.slice(0, 2), d.kp[4], d.kp[5]), tA = apply(B, { x: t.tx, y: t.ty });
    return { tf: { s: B.s * t.s, rot: B.rot + t.rot, tx: tA.x, ty: tA.y }, mouth: apply(B, d.kp[3]) };
  }
  function useFace(i) {
    const k = faces[i].keypoints, P = q => ({ x: q.x * src.width, y: q.y * src.height });
    tf = fitEyes(P(k[0]), P(k[1]), k[4] && P(k[4]), k[5] && P(k[5]));
    let m = apply(tf, P(k[3]));
    try { const r = refine(detector, tf); if (r) { tf = r.tf; m = r.mouth; } } catch (e) {}
    mouthY = Math.max(194, Math.min(230, OY + m.y / K + 4));
    syncSliders(); drawAlign();
    dStatus.innerHTML = faces.length > 1
      ? `✅ 找到 ${faces.length} 張臉 <a href="#" id="nextFace">換下一張</a>` : '✅ 已自動對準，可再微調。';
    const nf = $('#nextFace'); if (nf) nf.onclick = ev => { ev.preventDefault(); useFace((i + 1) % faces.length); };
  }

  let loadToken = 0;
  function openPhoto(file) {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const sc = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      src = document.createElement('canvas');
      src.width = Math.round(img.naturalWidth * sc); src.height = Math.round(img.naturalHeight * sc);
      src.getContext('2d').drawImage(img, 0, 0, src.width, src.height);
      mouthY = MOUTH_Y; faces = null;
      tf = fitDefault(src); syncSliders(); drawAlign();
      modal.classList.add('show');
      autoAlign(++loadToken);
    };
    img.onerror = () => { URL.revokeObjectURL(url); caption.textContent = '這張照片打不開，換一張試試。'; };
    img.src = url;
  }

  // ----- expressions: local warps of the aligned face -----
  function expressions(my) {
    const L = 211, R = 269, E = 146, B = 129;
    const mv = (x, y, dx, dy, r) => ({ t: 'm', x, y, dx, dy, r });
    const sc = (x, y, sx, sy, r) => ({ t: 's', x, y, sx, sy, r });
    const both = (f, ...a) => [f(L, ...a), f(R, ...a)];
    return {
      calm: [mv(220, my, -1, -3, 10), mv(260, my, 1, -3, 10), ...both(sc, E, 1, .9, 11)],
      nervous: [...both(mv, B, 0, -6, 15), ...both(sc, E, 1.12, 1.22, 12), sc(240, my, .82, .9, 18), mv(240, my, 0, 2, 16)],
      sorry: [mv(226, B, 0, -8, 11), mv(254, B, 0, -8, 11), mv(L - 10, B, 0, 3, 10), mv(R + 10, B, 0, 3, 10),
        ...both(sc, E, 1.04, .7, 12), mv(220, my, -1, 5, 9), mv(260, my, 1, 5, 9)],
      sad: [mv(226, B, 0, -10, 12), mv(254, B, 0, -10, 12), mv(L - 10, B + 2, 0, 4, 10), mv(R + 10, B + 2, 0, 4, 10),
        ...both(sc, E, 1.08, 1.1, 12), mv(220, my, -1, 8, 9), mv(260, my, 1, 8, 9), mv(240, my - 3, 0, -2, 8)],
      cry: [mv(226, B, 0, -11, 12), mv(254, B, 0, -11, 12), ...both(sc, E, 1.06, .5, 12),
        mv(220, my, -3, 9, 10), mv(260, my, 3, 9, 10), sc(240, my + 4, 1.25, 1.35, 20), mv(240, my + 22, 0, 6, 22)],
      breakdown: [...both(sc, E, 1.3, 1.3, 14), mv(240, B - 25, 0, -6, 30), sc(240, my + 4, 1.4, 1.8, 22), mv(240, my + 24, 0, 12, 26)],
    };
  }
  function warp(base, ctrls) {
    const out = new ImageData(PW, PH), d = base.data, o = out.data;
    const cs = ctrls.map(c => ({ ...c, x: (c.x - OX) * K, y: (c.y - OY) * K, r2: (c.r * K) ** 2, dx: (c.dx || 0) * K, dy: (c.dy || 0) * K }));
    for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
      let qx = x, qy = y;
      for (const c of cs) {
        const w = Math.exp(-((x - c.x) ** 2 + (y - c.y) ** 2) / c.r2);
        if (w < .002) continue;
        if (c.t === 'm') { qx -= w * c.dx; qy -= w * c.dy; }
        else { qx = c.x + (qx - c.x) / (1 + w * (c.sx - 1)); qy = c.y + (qy - c.y) / (1 + w * (c.sy - 1)); }
      }
      const x0 = Math.floor(qx), y0 = Math.floor(qy), fx = qx - x0, fy = qy - y0, i = (y * PW + x) * 4;
      if (x0 < 0 || y0 < 0 || x0 >= PW - 1 || y0 >= PH - 1) continue;
      const a = (y0 * PW + x0) * 4, b = a + 4, c2 = a + PW * 4, e = c2 + 4;
      for (let k = 0; k < 4; k++)
        o[i + k] = (d[a + k] * (1 - fx) + d[b + k] * fx) * (1 - fy) + (d[c2 + k] * (1 - fx) + d[e + k] * fx) * fy;
    }
    return out;
  }

  // average colour of both cheeks, for the neck
  function skinTone(img) {
    const px = [];
    for (const cx0 of [220, 260]) for (let dy = -6; dy <= 6; dy += 2) for (let dx = -6; dx <= 6; dx += 2) {
      const x = Math.round((cx0 + dx - OX) * K), y = Math.round((174 + dy - OY) * K), i = (y * PW + x) * 4;
      if (img.data[i + 3] > 200) px.push([img.data[i], img.data[i + 1], img.data[i + 2]]);
    }
    if (!px.length) return '#e8b591';
    px.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));     // drop darkest/brightest quarter
    const mid = px.slice(px.length >> 2, px.length - (px.length >> 2)), n = mid.length;
    const avg = j => Math.round(mid.reduce((t, p) => t + p[j], 0) / n);
    return `rgb(${avg(0)},${avg(1)},${avg(2)})`;
  }
  let faceUrls = null;
  function buildFaces(baseUrl, my) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = PW; c.height = PH;
        const g = c.getContext('2d');
        g.drawImage(img, 0, 0, PW, PH);
        const base = g.getImageData(0, 0, PW, PH), ex = expressions(my), urls = {};
        urls.skin = skinTone(base);
        for (const k in ex) {
          g.putImageData(warp(base, ex[k]), 0, 0);
          g.globalCompositeOperation = 'destination-in'; softMask(g); g.globalCompositeOperation = 'source-over';
          urls[k] = c.toDataURL('image/png');
        }
        res(urls);
      };
      img.onerror = rej; img.src = baseUrl;
    });
  }
  function showPhotoFace() {
    if (!faceUrls) return;
    photoEl.setAttribute('href', faceUrls[boss.dataset.state] || faceUrls.calm);
  }
  function setPhoto(urls, my) {
    faceUrls = urls; boss.classList.toggle('photo', !!urls);
    boss.querySelectorAll('.pmouth').forEach(g => g.setAttribute('transform', `translate(0 ${my})`));
    $('#photoBtn').textContent = urls ? '📷 換一張照片' : '📷 上傳老闆照片';
    if (urls) { showPhotoFace(); $('#neckSkin').setAttribute('fill', urls.skin); } else photoEl.removeAttribute('href');
  }
  async function applyBase(baseUrl, my) { setPhoto(await buildFaces(baseUrl, my), my); }

  $('#photoBtn').onclick = () => { $('#photoFile').value = ''; $('#photoFile').click(); };
  $('#photoFile').onchange = e => { const f = e.target.files[0]; if (f) openPhoto(f); };
  $('#photoCancel').onclick = () => { loadToken++; modal.classList.remove('show'); };
  $('#photoReset').onclick = () => {
    loadToken++; modal.classList.remove('show'); setPhoto(null, MOUTH_Y);
  };
  $('#photoOk').onclick = async () => {
    loadToken++;
    const c = document.createElement('canvas'); c.width = PW; c.height = PH;
    const g = c.getContext('2d'); drawPhoto(g, tf);
    const baseUrl = c.toDataURL('image/png'), my = mouthY;
    modal.classList.remove('show');
    await applyBase(baseUrl, my);
    speakLine('欸？你怎麼有我的照片？！');
  };
  // always start with the cartoon boss; drop any photo an older version kept in this browser
  try { localStorage.removeItem('stb.photo'); } catch (e) {}

  setState('calm'); render();
})();
</script>
</body>
</html>
